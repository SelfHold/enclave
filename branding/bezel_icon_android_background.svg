<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Background layer of bezel_icon_android.svg (no mark). Android adaptive icon (108 dp, launcher masks to the centre 72 dp). Same colours as bezel_icon.svg.
       The screen stays inside the 66 dp safe zone so every mask shape keeps the black bezel around it. -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse" x="30" y="30">
      <path d="M8 0H0V8" fill="none" stroke="#00d4ff" stroke-opacity="0.10" stroke-width="0.75"/>
    </pattern>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect width="108" height="108" fill="#000000"/>
  <g id="screen">
    <rect x="30" y="30" width="48" height="48" rx="3" fill="#080c10"/>
    <rect x="30" y="30" width="48" height="48" rx="3" fill="url(#grid)"/>
  </g>
</svg>
